<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | SMM360 VIP Care</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<!-- ================================================= -->
<!-- SECTION ID : LOGIN-001                            -->
<!-- LOGIN CONTAINER                                   -->
<!-- صفحه ورود                                         -->
<!-- ================================================= -->

<div class="login-container">

<div class="login-card">

<!-- Logo -->

<div class="logo">

<img src="../smm360-vip-care/assets/images/logo.png" alt="SMM360">

</div>

<!-- Title -->

<h1>SMM360 VIP Care</h1>

<h2>ورود به آنالیز هوشمند عملکرد بدن</h2>

<!-- Form -->

<form id="loginForm">

<div class="form-group">

<label>نام کاربری</label>

<input
type="text"
id="username"
placeholder="نام کاربری خود را وارد کنید"
autocomplete="username"
required>

</div>

<div class="form-group">

<label>رمز عبور</label>

<input
type="password"
id="password"
placeholder="رمز عبور"
autocomplete="current-password"
required>

</div>

<div class="options">

<label>

<input type="checkbox">

مرا به خاطر بسپار

</label>

<a href="#">بازیابی رمز عبور</a>

</div>

<button type="submit">

ورود به سامانه

</button>

</form>

<div class="version">

Version 0.0.1

</div>

<div class="copyright">

© SMM360 VIP CARE

</div>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
